# Banco PostgreSQL da aplicação. Suba com: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: plataforma-cursos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plataforma_cursos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
